<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Моё портфолио</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }

        .photo {
            width: 150px;
            height: 150px;
            background: #ccc;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .skills {
            font-size: 18px;
            text-align: center;
            margin-bottom: 40px;
        }

        .arrow {
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .arrow:hover {
            transform: translateX(5px);
        }

        a {
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <div class="photo"></div>
    <div class="skills">
        <p><strong>Python, Django, HTML, CSS, JS</strong></p>
        <p>Создаю сайты, телеграм-ботов, backend-сервисы</p>
    </div>
    <a href="/project/1/" class="arrow">→</a>
</body>
</html>
